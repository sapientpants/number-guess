name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run lint:spelling
      - run: pnpm run check-types

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Fails if any coverage metric drops below the thresholds in vitest.config.ts.
      - run: pnpm run test:coverage
        env:
          VITEST_SEGFAULT_RETRY: 3
          CI: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  quality:
    name: Code quality & bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run dead-code
      - run: pnpm run duplication
      - run: pnpm run deps:circular
      - run: pnpm run build
      - run: pnpm run size

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run OSV-Scanner
        uses: docker://ghcr.io/google/osv-scanner:v2.6.0
        with:
          args: scan --lockfile=pnpm-lock.yaml --skip-git=true --fail-on-vuln=true

