name: Mutation testing

# Mutation testing takes several minutes, so it runs weekly and on demand rather than per PR.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Fails if the mutation score drops below `thresholds.break` in stryker.config.json.
      - run: pnpm run mutation-test
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.sha }}
          path: reports/mutation/
          retention-days: 30
